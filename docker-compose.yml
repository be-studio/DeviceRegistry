services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: registry
      POSTGRES_PASSWORD: registry
      POSTGRES_DB: registry
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U registry -d registry"]
      interval: 2s
      timeout: 3s
      retries: 30

  app:
    build:
      context: .
      target: runtime
    environment:
      DATABASE_URL: postgres://registry:registry@db:5432/registry
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

  test:
    profiles: ["test"]
    build:
      context: .
      target: test
    environment:
      TEST_DATABASE_URL: postgres://registry:registry@db:5432/registry_test
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
